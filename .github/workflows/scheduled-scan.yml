name: scheduled scan

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned OSV-Scanner release
        env:
          OSV_SCANNER_VERSION: v2.7.0
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/google/osv-scanner/releases/download/${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            --output /tmp/osv-scanner
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  /tmp/osv-scanner" | sha256sum --check --status
          chmod 0755 /tmp/osv-scanner
          echo /tmp >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Scan this repository and validate report
        run: |
          osv-scanner --version
          PYTHONPATH=src python -m zsi.cli scan --repository . --commit "$GITHUB_SHA" --output reports/security-report.json
          PYTHONPATH=src python -m zsi.cli validate reports/security-report.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zsi-report-${{ github.sha }}
          path: reports/security-report.json
          if-no-files-found: error
          retention-days: 14
